
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Basket V5</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--purple:#703bd3;--light:#f7f5fc;--text:#29223b;--muted:#81798f;--border:#eae5f2}
*{box-sizing:border-box}
body{margin:0;background:var(--light);color:var(--text);font-family:Sarabun,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b7a0ee}
header{background:white;border-bottom:1px solid var(--border)}
.container{max-width:1150px;margin:auto;padding:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:25px;font-weight:800}
.brand span{color:var(--purple)}
.muted{color:var(--muted);font-size:13px}
h1{font-size:29px;margin:8px 0}
h2{font-size:21px;margin:0}
.btn{padding:11px 16px;border-radius:12px;background:#f0ebfa;color:var(--purple);min-height:44px}
.primary{background:var(--purple);color:white}
.danger{background:#fff0f2;color:#bd334b}
.iconbtn{width:44px;padding:8px;font-size:19px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero{margin:16px 0 20px}
.lists{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.listcard{background:white;border:2px solid transparent;border-radius:18px;padding:19px;text-align:left;min-height:125px}
.listcard.active{border-color:var(--purple)}
.listcard strong{display:block;font-size:18px;margin:10px 0 4px}
.panel{background:white;border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:18px}
.stats{display:flex;gap:25px}
.stat{text-align:center}
.stat strong{display:block;font-size:27px}
.bar{background:#eee8f8;height:9px;border-radius:10px;overflow:hidden;margin-top:15px}
.fill{background:var(--purple);height:100%;width:0}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:9px}
.field{width:100%;min-width:0;padding:12px;border:1px solid var(--border);border-radius:11px;background:white;color:var(--text)}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.product{background:white;border:1px solid var(--border);border-radius:18px;padding:15px}
.productbody{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px}
.photo{width:120px;height:135px;border-radius:13px;object-fit:contain;background:#f1eef7}
.placeholder{display:flex;align-items:center;justify-content:center;font-size:45px}
.name{font-size:18px;font-weight:800;overflow-wrap:anywhere}
.price{font-size:23px;font-weight:800;color:var(--purple);margin:7px 0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{background:#f2eff8;border-radius:8px;padding:5px 8px;font-size:12px}
.done{color:#087c5d;background:#e3f6ec}
.actions{display:flex;gap:8px;border-top:1px solid var(--border);padding-top:12px;margin-top:14px}
.actions .buy{flex:1}
.empty{grid-column:1/-1;text-align:center;padding:40px;background:white;border-radius:18px}
.overlay{position:fixed;inset:0;background:#1e143a99;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}
.overlay.show{display:flex}
.modal{background:white;border-radius:20px;padding:22px;width:100%;max-width:600px;max-height:90vh;overflow:auto}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.small{font-size:12px;color:var(--muted)}
@media(max-width:850px){
.lists{grid-template-columns:repeat(2,1fr)}
.products{grid-template-columns:1fr}
.filters{grid-template-columns:1fr 1fr}
.filters input{grid-column:1/-1}
}
@media(max-width:520px){
.container{padding:14px}
.brand{font-size:21px}
h1{font-size:25px}
.panel{padding:14px}
.listcard{padding:13px}
.stats{gap:12px}
.stat strong{font-size:23px}
.productbody{grid-template-columns:100px minmax(0,1fr);gap:11px}
.photo{width:100px;height:115px}
.name{font-size:16px}
.price{font-size:20px}
.formgrid{grid-template-columns:1fr}
.full{grid-column:auto}
}
</style>
</head>
<body>

<header>
<div class="container top">
<div>
<div class="brand">Smart <span>Basket</span> 🛍️</div>
<div class="muted">Save what you love. Shop together.</div>
</div>
<div class="row">
<button class="btn" id="backupBtn">↧ Backup</button>
<button class="btn" id="importBtn">↥ Import</button>
<input type="file" id="importFile" accept=".json" hidden>
</div>
</div>
</header>

<main class="container">
<div class="row hero">
<div>
<div class="muted">YOUR SPACE</div>
<h1>My Wishlists ♡</h1>
<div class="muted">เก็บทุกอย่างที่อยากได้ไว้ในที่เดียว</div>
</div>
<button class="btn primary" id="newList">＋ New List</button>
</div>

<section id="lists" class="lists"></section>

<section class="panel">
<div class="row">
<div>
<div class="muted">CURRENT LIST</div>
<h2 id="listTitle"></h2>
<div class="small" id="budget"></div>
</div>
<div class="stats">
<div class="stat"><strong id="total">0</strong><span class="small">ทั้งหมด</span></div>
<div class="stat"><strong id="pending">0</strong><span class="small">ยังไม่ซื้อ</span></div>
<div class="stat"><strong id="bought">0</strong><span class="small">ซื้อแล้ว</span></div>
</div>
</div>
<div class="bar"><div class="fill" id="progress"></div></div>
<div class="small" id="progressText"></div>
</section>

<div class="row" style="margin:24px 0 14px">
<h2>Shopping List</h2>
<div class="row">
<button class="btn" id="manageList">⋯ List</button>
<button class="btn primary" id="addBtn">＋ Add Item</button>
</div>
</div>

<section class="panel">
<div class="filters">
<input class="field" id="search" placeholder="⌕ ค้นหาสินค้า หรือร้านค้า">
<select class="field" id="catFilter"><option value="">ทุกหมวดหมู่</option></select>
<select class="field" id="ownerFilter"><option value="">ทุกคน</option></select>
<select class="field" id="statusFilter">
<option value="">ทุกสถานะ</option>
<option value="pending">ยังไม่ซื้อ</option>
<option value="bought">ซื้อแล้ว</option>
</select>
</div>
<div style="text-align:right;margin-top:10px">
<select class="field" id="sort" style="max-width:190px">
<option value="new">ล่าสุดก่อน</option>
<option value="name">ชื่อ A-Z</option>
<option value="low">ราคาต่ำก่อน</option>
<option value="high">ราคาสูงก่อน</option>
</select>
</div>
</section>

<section class="products" id="products"></section>
<p class="small">ข้อมูลยังเก็บในเบราว์เซอร์เครื่องนี้เท่านั้น ยังไม่ Sync ข้ามเครื่อง กรุณา Backup เป็นระยะ</p>
</main>

<div class="overlay" id="overlay">
<div class="modal" role="dialog" aria-modal="true" aria-labelledby="formTitle">
<div class="row">
<h2 id="formTitle">Add Item</h2>
<button class="btn iconbtn" id="closeBtn" type="button">×</button>
</div>
<form id="form">
<input type="hidden" id="editId">
<div class="formgrid">
<div class="full">
<label>ชื่อสินค้า *</label>
<input class="field" id="itemName" maxlength="180" required>
</div>
<div>
<label>หมวดหมู่</label>
<select class="field" id="category"></select>
</div>
<div>
<label>ใครอยากได้</label>
<input class="field" id="owner" placeholder="เรา / แฟน / ทั้งคู่">
</div>
<div>
<label>ราคา</label>
<input class="field" id="price" type="number" min="0" step=".01">
</div>
<div>
<label>สกุลเงิน</label>
<select class="field" id="currency">
<option value="THB">THB ฿</option>
<option value="JPY">JPY ¥</option>
<option value="USD">USD $</option>
<option value="EUR">EUR €</option>
</select>
</div>
<div>
<label>จำนวน</label>
<input class="field" id="qty" type="number" min="1" step="1" value="1">
</div>
<div>
<label>สถานะ</label>
<select class="field" id="status">
<option value="pending">ยังไม่ซื้อ</option>
<option value="bought">ซื้อแล้ว</option>
</select>
</div>
<div class="full">
<label>ร้านค้า</label>
<input class="field" id="store">
</div>
<div class="full">
<label>สี / ไซส์ / รายละเอียด</label>
<input class="field" id="description">
</div>
<div class="full">
<label>ลิงก์รูปสินค้า (HTTPS)</label>
<input class="field" id="image" type="url" placeholder="https://...">
</div>
<div class="full">
<label>ลิงก์หน้าสินค้า (HTTPS)</label>
<input class="field" id="productLink" type="url" placeholder="https://...">
</div>
</div>
<div class="footer">
<button class="btn" type="button" id="cancelBtn">Cancel</button>
<button class="btn primary" type="submit">Save Item</button>
</div>
</form>
</div>
</div>

<script>
"use strict";

const KEY="smart_basket_v5";
const $=id=>document.getElementById(id);
const CATS=["รองเท้า","เสื้อผ้า","กระเป๋า","อาหาร","ขนม","เครื่องสำอาง","ของใช้","อิเล็กทรอนิกส์","อื่นๆ"];
const ICONS={"รองเท้า":"👟","เสื้อผ้า":"🧥","กระเป๋า":"👜","อาหาร":"🍱","ขนม":"🍫","เครื่องสำอาง":"💄","ของใช้":"🧴","อิเล็กทรอนิกส์":"📱"};

function uid(){
return crypto.randomUUID ? crypto.randomUUID() :
Date.now()+"-"+Math.random().toString(36).slice(2);
}

function seed(){
const id=uid();
return {
version:5,
active:id,
lists:[{
id,name:"Japan 2026",emoji:"🇯🇵",
items:[
{id:uid(),name:"On Cloudtilt",category:"รองเท้า",owner:"เรา",description:"All White · Men US 7.5",price:6600,currency:"THB",qty:1,store:"On",image:"",productLink:"",status:"pending",createdAt:3},
{id:uid(),name:"UNIQLO เสื้อคลุม",category:"เสื้อผ้า",owner:"แฟน",description:"สีน้ำตาล · Women XL",price:null,currency:"JPY",qty:1,store:"UNIQLO",image:"",productLink:"",status:"pending",createdAt:2},
{id:uid(),name:"3COINS กระเป๋าพับได้",category:"กระเป๋า",owner:"ทั้งคู่",description:"กระเป๋าพับเก็บได้",price:null,currency:"JPY",qty:1,store:"3COINS",image:"",productLink:"",status:"pending",createdAt:1}
]
}]
};
}

function valid(s){
return s&&s.version===5&&Array.isArray(s.lists)&&
s.lists.length<=100&&s.lists.every(l=>
typeof l.id==="string"&&typeof l.name==="string"&&
Array.isArray(l.items)&&l.items.length<=10000&&
l.items.every(i=>typeof i.id==="string"&&typeof i.name==="string"));
}

let state;
try{
const raw=localStorage.getItem(KEY);
state=raw?JSON.parse(raw):seed();
if(!valid(state))throw Error("Invalid data");
}catch(e){state=seed()}

function save(){
try{
localStorage.setItem(KEY,JSON.stringify(state));
return true;
}catch(e){
alert("บันทึกไม่สำเร็จ กรุณาสำรองข้อมูล");
return false;
}
}

function change(fn){
const before=JSON.stringify(state);
fn();
if(!save())state=JSON.parse(before);
render();
}

function active(){
return state.lists.find(l=>l.id===state.active)||state.lists[0];
}

function money(n,c){
if(n===null||n===undefined||n==="")return "ยังไม่ระบุราคา";
try{
return new Intl.NumberFormat("th-TH",{
style:"currency",currency:c||"THB",maximumFractionDigits:0
}).format(Number(n));
}catch(e){return String(n)}
}

function element(tag,cls,text){
const e=document.createElement(tag);
if(cls)e.className=cls;
if(text!==undefined)e.textContent=String(text);
return e;
}

function button(text,cls,action){
const b=element("button","btn "+cls,text);
b.type="button";
b.onclick=action;
return b;
}

function render(){
if(!state.lists.length){
state.lists=[{id:uid(),name:"My Wishlist",emoji:"💜",items:[]}];
}
if(!state.lists.some(l=>l.id===state.active)){
state.active=state.lists[0].id;
}
const l=active();
const root=$("lists");
root.replaceChildren();

state.lists.forEach(x=>{
const b=element("button","listcard"+(x.id===l.id?" active":""));
b.type="button";
b.append(
element("div","",x.emoji||"💜"),
element("strong","",x.name),
element("div","muted",x.items.length+" items · "+x.items.filter(i=>i.status==="bought").length+" bought")
);
b.onclick=()=>{
state.active=x.id;
save();
render();
};
root.append(b);
});

$("listTitle").textContent=(l.emoji||"💜")+" "+l.name;
const total=l.items.length;
const bought=l.items.filter(i=>i.status==="bought").length;
$("total").textContent=total;
$("pending").textContent=total-bought;
$("bought").textContent=bought;
const pct=total?Math.round(bought/total*100):0;
$("progress").style.width=pct+"%";
$("progressText").textContent=pct+"% completed";

const totals={};
l.items.filter(i=>i.status==="pending"&&i.price!=null).forEach(i=>{
const c=i.currency||"THB";
totals[c]=(totals[c]||0)+Number(i.price)*(Number(i.qty)||1);
});
$("budget").textContent=Object.keys(totals).length?
"ยอดที่ยังไม่ซื้อ: "+Object.entries(totals).map(([c,n])=>money(n,c)).join(" · "):
"ยังไม่มีราคาสินค้าที่รอซื้อ";

const cat=$("catFilter").value;
const owner=$("ownerFilter").value;
$("catFilter").replaceChildren(
new Option("ทุกหมวดหมู่",""),
...CATS.map(c=>new Option(c,c))
);
$("catFilter").value=cat;
$("ownerFilter").replaceChildren(
new Option("ทุกคน",""),
...Array.from(new Set(l.items.map(i=>i.owner).filter(Boolean))).map(o=>new Option(o,o))
);
$("ownerFilter").value=owner;
renderItems();
}

function renderItems(){
const l=active();
const q=$("search").value.toLowerCase().trim();
const cat=$("catFilter").value;
const owner=$("ownerFilter").value;
const status=$("statusFilter").value;
const sort=$("sort").value;

const items=l.items.filter(i=>
(!q||[i.name,i.description,i.store,i.category].join(" ").toLowerCase().includes(q))&&
(!cat||i.category===cat)&&
(!owner||i.owner===owner)&&
(!status||i.status===status)
);

items.sort((a,b)=>{
if(sort==="name")return a.name.localeCompare(b.name,"th");
if(sort==="low")return (a.price??Infinity)-(b.price??Infinity);
if(sort==="high")return (b.price??-Infinity)-(a.price??-Infinity);
return (b.createdAt||0)-(a.createdAt||0);
});

const root=$("products");
root.replaceChildren();

if(!items.length){
root.append(element("div","empty","ยังไม่มีสินค้าที่ตรงกับเงื่อนไข ✨"));
return;
}

items.forEach(i=>{
const card=element("article","product");
const body=element("div","productbody");
let photo;

if(i.image&&/^https:\/\//i.test(i.image)){
photo=element("img","photo");
photo.src=i.image;
photo.alt=i.name;
photo.loading="lazy";
photo.referrerPolicy="no-referrer";
photo.onerror=()=>{
photo.replaceWith(element("div","photo placeholder",ICONS[i.category]||"🛍️"));
};
}else{
photo=element("div","photo placeholder",ICONS[i.category]||"🛍️");
}
body.append(photo);

const info=element("div");
info.append(element("div","name",i.name));
if(i.description)info.append(element("div","muted",i.description));
info.append(element("div","price",money(i.price,i.currency)));
info.append(element("div","small","📍 "+(i.store||"ไม่ระบุร้าน")+" · จำนวน "+(i.qty||1)));

const tags=element("div","tags");
[
i.category||"อื่นๆ",
"♡ "+(i.owner||"ไม่ระบุ"),
i.status==="bought"?"✓ ซื้อแล้ว":"○ ยังไม่ซื้อ"
].forEach((t,index)=>{
tags.append(element("span","tag"+(index===2&&i.status==="bought"?" done":""),t));
});
info.append(tags);

if(i.productLink&&/^https:\/\//i.test(i.productLink)){
const link=element("a","small","ดูสินค้าที่ร้าน ↗");
link.href=i.productLink;
link.target="_blank";
link.rel="noopener noreferrer";
info.append(link);
}

body.append(info);
card.append(body);

const actions=element("div","actions");
actions.append(
button(i.status==="bought"?"↶ ยังไม่ซื้อ":"✓ ซื้อแล้ว",
"buy "+(i.status==="bought"?"":"primary"),
()=>change(()=>{i.status=i.status==="bought"?"pending":"bought"})
),
button("✎","iconbtn",()=>openForm(i)),
button("🗑","iconbtn danger",()=>{
if(confirm("ลบ "+i.name+" ?")){
change(()=>{l.items=l.items.filter(x=>x.id!==i.id)});
}
})
);
card.append(actions);
root.append(card);
});
}

function openForm(i){
$("form").reset();
$("editId").value=i?.id||"";
$("formTitle").textContent=i?"Edit Item":"Add Item";
$("category").replaceChildren(...CATS.map(c=>new Option(c,c)));
$("category").value=i?.category||"อื่นๆ";

const fields=["itemName","owner","price","currency","qty","status","store","description","image","productLink"];
const keys=["name","owner","price","currency","qty","status","store","description","image","productLink"];

if(i){
fields.forEach((f,index)=>{
$(f).value=i[keys[index]]??"";
});
}else{
$("owner").value="เรา";
$("qty").value=1;
$("currency").value="THB";
$("status").value="pending";
}
$("overlay").classList.add("show");
$("itemName").focus();
}

function closeForm(){
$("overlay").classList.remove("show");
}

$("form").onsubmit=e=>{
e.preventDefault();
const l=active();
const id=$("editId").value;
const old=l.items.find(i=>i.id===id);
const name=$("itemName").value.trim();
if(!name)return;

const item={
id:old?.id||uid(),
name,
category:$("category").value,
owner:$("owner").value.trim(),
price:$("price").value===""?null:Number($("price").value),
currency:$("currency").value,
qty:Math.max(1,Math.floor(Number($("qty").value)||1)),
status:$("status").value,
store:$("store").value.trim(),
description:$("description").value.trim(),
image:$("image").value.trim(),
productLink:$("productLink").value.trim(),
createdAt:old?.createdAt||Date.now()
};

change(()=>{
if(old)l.items=l.items.map(x=>x.id===id?item:x);
else l.items.unshift(item);
});
closeForm();
};

$("addBtn").onclick=()=>openForm();
$("closeBtn").onclick=closeForm;
$("cancelBtn").onclick=closeForm;
$("overlay").onclick=e=>{
if(e.target===$("overlay"))closeForm();
};
document.addEventListener("keydown",e=>{
if(e.key==="Escape")closeForm();
});

$("newList").onclick=()=>{
const name=prompt("ชื่อ Wishlist ใหม่");
if(!name?.trim())return;
change(()=>{
const l={id:uid(),name:name.trim().slice(0,100),emoji:"💜",items:[]};
state.lists.push(l);
state.active=l.id;
});
};

$("manageList").onclick=()=>{
const l=active();
const action=prompt("พิมพ์ 1 เพื่อเปลี่ยนชื่อ หรือ 2 เพื่อลบลิสต์","1");
if(action==="1"){
const name=prompt("ชื่อใหม่",l.name);
if(name?.trim())change(()=>{l.name=name.trim().slice(0,100)});
}else if(action==="2"){
if(state.lists.length===1){
alert("ต้องเหลืออย่างน้อย 1 Wishlist");
return;
}
if(confirm("ลบลิสต์ "+l.name+" และสินค้าทั้งหมด?")){
change(()=>{
state.lists=state.lists.filter(x=>x.id!==l.id);
state.active=state.lists[0].id;
});
}
}
};

["search","catFilter","ownerFilter","statusFilter","sort"].forEach(id=>{
$(id).addEventListener(id==="search"?"input":"change",renderItems);
});

$("backupBtn").onclick=()=>{
const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download="smart-basket-backup.json";
a.click();
setTimeout(()=>URL.revokeObjectURL(url),2000);
};

$("importBtn").onclick=()=>$("importFile").click();

$("importFile").onchange=async e=>{
const file=e.target.files?.[0];
if(!file)return;
try{
if(file.size>5*1024*1024)throw Error("ไฟล์ใหญ่เกิน 5 MB");

}finally{
e.target.value="";
}
};
